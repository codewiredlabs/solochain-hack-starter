# Formatting rules of the Polkadot SDK (`.rustfmt.toml` at tag polkadot-stable2609-2), so code
# copied between this repo, the SDK and its templates needs no reformatting.
#
# Several options are unstable, so format with nightly: `cargo +nightly fmt --all`.
#
# One deliberate difference from the SDK: the crates here use Rust edition 2024, which would
# also switch rustfmt to the 2024 style (different import sorting). `style_edition` keeps the
# SDK's 2021 style, so files synced from the upstream template stay byte-for-byte identical.

# Basic
edition = "2024"
style_edition = "2021"
hard_tabs = true
max_width = 100
use_small_heuristics = "Max"
# Imports
imports_granularity = "Crate"
reorder_imports = true
# Consistency
newline_style = "Unix"
normalize_comments = true
normalize_doc_attributes = true
# Misc
chain_width = 80
spaces_around_ranges = false
binop_separator = "Back"
reorder_impl_items = false
match_arm_leading_pipes = "Never"
match_arm_blocks = true
match_block_trailing_comma = true
trailing_comma = "Vertical"
trailing_semicolon = true
use_field_init_shorthand = true
# Format comments
comment_width = 100
wrap_comments = true
